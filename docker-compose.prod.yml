version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: k4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: k4_aicontroller
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_here
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d k4_aicontroller"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: k4-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-38-46Z
    container_name: k4-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: k4-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_password_here@postgres:5432/k4_aicontroller?schema=public
      - REDIS_URL=redis://redis:6379
      - APP_MODE=production
      - APP_URL=http://localhost:3000
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - JWT_SECRET=your_jwt_secret_here
      - OPENAI_API_KEY=your_openai_api_key_here
      - AMOCRM_CLIENT_ID=015e5f36-f518-4037-8e30-60714cb8a645
      - AMOCRM_CLIENT_SECRET=V7Tk2gaGyE5DibPcQjZOWSVYtfIXdFczW6cnaL2sSLEPs344DXsbDIErlk5AT2NS
      - AMOCRM_REDIRECT_URI=http://localhost:3000/api/integrations/amocrm/callback
      - ONLINEPBX_API_KEY=your_onlinepbx_api_key
      - ONLINEPBX_WEBHOOK_SECRET=your_onlinepbx_webhook_secret
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=k4-audio-recordings
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadminpassword
      - S3_FORCE_PATH_STYLE=true
      - BOOTSTRAP_ADMIN_EMAIL=admin@marketingmarkazi.uz
      - BOOTSTRAP_ADMIN_PASSWORD=CHANGE_ME_STRONG_PASSWORD
      - BOOTSTRAP_ADMIN_NAME=Marketing Markazi Admin

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: k4-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_password_here@postgres:5432/k4_aicontroller?schema=public
      - REDIS_URL=redis://redis:6379
      - APP_MODE=production
      - APP_URL=http://localhost:3000
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - OPENAI_API_KEY=your_openai_api_key_here
      - ONLINEPBX_API_KEY=your_onlinepbx_api_key
      - ONLINEPBX_WEBHOOK_SECRET=your_onlinepbx_webhook_secret
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=k4-audio-recordings
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadminpassword
      - S3_FORCE_PATH_STYLE=true

volumes:
  postgres_data:
  redis_data:
  minio_data:
